openapi: 3.1.0
info:
  title: SLSEA Real-Time Solar Generation Data API
  version: 1.0.0
  summary: Ingests and serves rooftop solar generation data for the Sri Lanka Sustainable Energy Authority.
  license:
    name: Proprietary (NB6007CEM coursework, all rights reserved)
    url: https://github.com/akilaisadev/slsea-solar-api
  description: |
    REST API at the centre of SLSEA's national solar monitoring system (NB6007CEM coursework).

    **Two kinds of client, two permissions**
    - *Metering devices* (write clients) authenticate as one installation and may only append
      generation readings for that installation (`readings:write`).
    - *SLSEA users* (read clients) read data inside their jurisdiction: national, one province or one
      district (`assets:read`, `readings:read`). Asset administrators may also manage installations
      (`installations:write`).

    **Getting a token:** `POST /oauth2/token`, or use the **Authorize** button. Demo credentials are
    listed in the repository README.

    **Conventions:** JSON only (`application/json`); snake_case fields with units in the name
    (`power_kw`, `energy_kwh`, `voltage_v`); timestamps are ISO 8601 UTC; collections are paginated with
    `offset`/`limit` and return `count`, `next` and `previous`; every GET supports conditional requests
    (`If-None-Match` / `If-Modified-Since` → `304`); every error uses the `Error` schema.
    Every response carries an `X-Request-Id` header (a client-supplied one of up to 64 safe characters
    is kept); quote it when reporting a problem.
servers:
  - url: /solar/v1
    description: This deployment (versioned base path)
security:
  - bearerAuth: []
tags:
  - name: Hierarchy
    description: Provinces, districts and grid substations (read only)
  - name: Installations
    description: Rooftop solar installations (the metered assets)
  - name: Readings
    description: Append-only generation time series
  - name: Analytics
    description: Derived, processing-style resources
  - name: Auth
    description: Token issuance (OAuth 2.0 style)
  - name: Operations
    description: Health and error documentation

paths:
  /health:
    servers:
      - url: /
    get:
      tags: [ Operations ]
      summary: Liveness probe (does not touch the database)
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
  /health/database:
    servers:
      - url: /
    get:
      tags:
        - Operations
      summary: 'Readiness: is the database reachable?'
      operationId: getDatabaseHealth
      security: []
      responses:
        '200':
          description: The database answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealth'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseHealth'
  /errors/{error-code}:
    servers:
      - url: /
    get:
      tags: [ Operations ]
      summary: Explanation of one error code (the target of every `more_info` link)
      operationId: getErrorCode
      security: []
      parameters:
        - name: error-code
          in: path
          required: true
          schema: { type: integer, example: 40401 }
      responses:
        '200':
          description: The error catalogue entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorCatalogueEntry' }
        '404': { $ref: '#/components/responses/NotFound' }

  /oauth2/token:
    servers:
      - url: /
    post:
      tags: [ Auth ]
      summary: Obtain a JWT bearer access token
      description: |
        Modelled on the OAuth 2.0 token endpoint (RFC 6749). Devices use `client_credentials` with their
        installation id as `client_id` (credentials may also be sent as HTTP Basic). SLSEA users use the
        `password` grant. A token is not a stored resource, so success is `200`. Failed attempts are
        rate-limited per credential (10 per 15 minutes).
      operationId: issueToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
            examples:
              user:
                summary: SLSEA user (password grant)
                value: { grant_type: password, username: colombo.analyst, password: '<demo password>' }
              device:
                summary: Metering device (client credentials)
                value: { grant_type: client_credentials, client_id: ins-0001, client_secret: '<device secret>' }
      responses:
        '200':
          description: Access token issued.
          headers:
            Cache-Control:
              description: Token responses are never cached.
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid client or user credentials.
          headers:
            WWW-Authenticate:
              description: Challenge for client authentication.
              schema: { type: string, example: 'Basic realm="slsea-oauth2"' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /provinces:
    get:
      tags: [ Hierarchy ]
      summary: List provinces (collection)
      operationId: listProvinces
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      responses:
        '200':
          description: A page of provinces within the caller's jurisdiction.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProvinceCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '406': { $ref: '#/components/responses/NotAcceptable' }
      security:
        - oauth2:
            - assets:read
        - bearerAuth: []
  /provinces/{province-id}:
    parameters:
      - $ref: '#/components/parameters/ProvinceId'
    get:
      tags: [ Hierarchy ]
      summary: Get one province (atomic)
      operationId: getProvince
      responses:
        '200':
          description: The province.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Province' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      security:
        - oauth2:
            - assets:read
        - bearerAuth: []
  /districts:
    get:
      tags: [ Hierarchy ]
      summary: List districts (collection)
      operationId: listDistricts
      parameters:
        - $ref: '#/components/parameters/ProvinceIdFilter'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      responses:
        '200':
          description: A page of districts within the caller's jurisdiction.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistrictCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      security:
        - oauth2:
            - assets:read
        - bearerAuth: []
  /districts/{district-id}:
    parameters:
      - $ref: '#/components/parameters/DistrictId'
    get:
      tags: [ Hierarchy ]
      summary: Get one district (atomic)
      operationId: getDistrict
      responses:
        '200':
          description: The district.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/District' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      security:
        - oauth2:
            - assets:read
        - bearerAuth: []
  /districts/{district-id}/generation-summary:
    parameters:
      - $ref: '#/components/parameters/DistrictId'
    get:
      tags: [ Analytics ]
      summary: District generation summary (operational dashboard view)
      description: |
        Processing-function resource (WSO2 §4.5), computed on every request across all registered
        installations in the district:
        - `current_total_power_kw`: sum of each site's latest power, counting only sites that reported
          within the last `reporting_window_minutes`. Always describes now.
        - `total_energy_kwh`: energy generated on `date` (Asia/Colombo calendar day, default today),
          derived from each inverter's cumulative counter: last value in the day minus the last value
          before it.
      operationId: getDistrictGenerationSummary
      parameters:
        - name: date
          in: query
          description: Calendar day (Asia/Colombo) for total_energy_kwh; defaults to today; not in the future.
          schema: { type: string, format: date, example: '2026-10-02' }
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/IfModifiedSince'
      responses:
        '200':
          description: The summary.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerationSummary' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      security:
        - oauth2:
            - readings:read
        - bearerAuth: []
  /grid-substations:
    get:
      tags: [ Hierarchy ]
      summary: List grid substations (collection)
      operationId: listGridSubstations
      parameters:
        - $ref: '#/components/parameters/ProvinceIdFilter'
        - $ref: '#/components/parameters/DistrictIdFilter'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      responses:
        '200':
          description: A page of grid substations within the caller's jurisdiction.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridSubstationCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      security:
        - oauth2:
            - assets:read
        - bearerAuth: []
  /grid-substations/{substation-id}:
    parameters:
      - $ref: '#/components/parameters/SubstationId'
    get:
      tags: [ Hierarchy ]
      summary: Get one grid substation (atomic)
      operationId: getGridSubstation
      responses:
        '200':
          description: The grid substation.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GridSubstation' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      security:
        - oauth2:
            - assets:read
        - bearerAuth: []
  /installations:
    get:
      tags: [ Installations ]
      summary: List installations (collection)
      operationId: listInstallations
      parameters:
        - $ref: '#/components/parameters/ProvinceIdFilter'
        - $ref: '#/components/parameters/DistrictIdFilter'
        - $ref: '#/components/parameters/SubstationIdFilter'
        - name: status
          in: query
          schema: { type: string, enum: [ active, maintenance ] }
        - name: sort
          in: query
          schema: { type: string, enum: [ installation_id, capacity_kw, commissioned_on ], default: installation_id }
        - name: order
          in: query
          schema: { type: string, enum: [ asc, desc ], default: asc }
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      responses:
        '200':
          description: A page of active and under-maintenance installations within the caller's jurisdiction.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      security:
        - oauth2:
            - assets:read
        - bearerAuth: []
    post:
      tags: [ Installations ]
      summary: Register a new installation (asset administrators)
      description: |
        The collection is the factory for its members (WSO2 §7.3). The server assigns `installation_id` and
        a device secret, which is returned **once** in `device_secret` (only its hash is stored). The
        response body is the new resource's composite plus that secret; `ETag` and `Last-Modified` describe
        the resource as `GET` will return it.
      operationId: createInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallationCreate' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
      security:
        - oauth2:
            - installations:write
        - bearerAuth: []
  /installations/{installation-id}:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [ Installations ]
      summary: Get one installation with its location and latest reading (composite)
      description: |
        Composite resource (WSO2 §4.3): the installation, its place in the grid hierarchy and its most
        recent reading (`null` if it has never reported). The full history is the `readings` sub-collection.
      operationId: getInstallation
      responses:
        '200':
          description: The installation composite.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationComposite' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      security:
        - oauth2:
            - assets:read
            - readings:read
        - bearerAuth: []
    put:
      tags: [ Installations ]
      summary: Replace an installation (whole-resource replacement)
      description: |
        PUT replaces the complete resource (WSO2 §7.2): every writable field is required; a missing field is
        an error, not "keep the old value" (use PATCH for that). Idempotent. Send `If-Match` with the ETag
        you last saw to avoid overwriting someone else's change (412 if it is stale). A successful
        conditional write returns 204 without a response body; GET the resource for its new representation.
      operationId: replaceInstallation
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfUnmodifiedSince'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstallationInput' }
      responses:
        '200':
          description: Replaced; the new representation.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationComposite' }
        '204':
          description: Conditional write succeeded; no response body.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
      security:
        - oauth2:
            - installations:write
        - bearerAuth: []
    patch:
      tags: [ Installations ]
      summary: Update some fields of an installation (JSON Merge Patch)
      description: |
        Partial update as a JSON Merge Patch (RFC 7396): send only the fields to change. `If-Match` gives
        optimistic concurrency control (412 if stale). A successful conditional write returns 204
        without a response body; GET the resource for its new representation.
      operationId: updateInstallation
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfUnmodifiedSince'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/InstallationPatch' }
          application/json:
            schema: { $ref: '#/components/schemas/InstallationPatch' }
      responses:
        '200':
          description: Updated; the new representation.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallationComposite' }
        '204':
          description: Conditional write succeeded; no response body.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
      security:
        - oauth2:
            - installations:write
        - bearerAuth: []
    delete:
      tags: [ Installations ]
      summary: Decommission an installation
      description: |
        Removes the installation from the API (WSO2 §7.4): 200 the first time, 404 afterwards. Its readings
        are kept as generation history, and its device can no longer obtain tokens. Successful
        conditional deletion returns 204 without a response body.
      operationId: decommissionInstallation
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfUnmodifiedSince'
      responses:
        '200':
          description: Decommissioned; the installation as it was when it left service.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecommissionedInstallation' }
        '204':
          description: Conditional write succeeded; no response body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
      security:
        - oauth2:
            - installations:write
        - bearerAuth: []
  /installations/{installation-id}/last-reading:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [ Readings ]
      summary: Latest reading of an installation (operational view)
      description: |
        Processing-function resource (WSO2 §4.5): derived from the time series on every request; nothing
        is stored as "last value" on the installation. 404 if the installation has never reported.
      operationId: getLastReading
      responses:
        '200':
          description: The most recent reading by measurement time.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      security:
        - oauth2:
            - readings:read
        - bearerAuth: []
  /installations/{installation-id}/readings:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
    get:
      tags: [ Readings ]
      summary: Generation history of one installation (scoped collection)
      operationId: listInstallationReadings
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ReadingSort'
        - $ref: '#/components/parameters/ReadingOrder'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      responses:
        '200':
          description: A page of readings, newest first. An installation with no readings returns an empty page.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      security:
        - oauth2:
            - readings:read
        - bearerAuth: []
    post:
      tags: [ Readings ]
      summary: Append a generation reading (metering devices)
      description: |
        A device appends one reading for **its own** installation (the token's subject must match the path:
        otherwise 403). The installation comes from the URI, never the body; `reading_id` and `received_at`
        are set by the server. One reading per installation per instant: re-sending one gets 409 with the
        URI of the existing reading, so retries are harmless. Cumulative `energy_kwh` may not fall below the
        previous reading, `power_kw` may not exceed 125% of capacity, and `recorded_at` may not be in the future.
      operationId: createReading
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReadingInput' }
      responses:
        '201':
          description: Created; `Location` is the new reading's URI.
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
      security:
        - oauth2:
            - readings:write
        - bearerAuth: []
  /readings:
    get:
      tags: [ Readings ]
      summary: Regional generation history across installations (analytical view)
      description: |
        Read-only view of readings across installations, filtered by jurisdiction (province, district or
        substation) and time window, always clipped to the caller's own jurisdiction. Readings are created
        only through `POST /installations/{installation-id}/readings`. A filter naming another
        jurisdiction is refused with 403.
      operationId: listRegionalReadings
      parameters:
        - $ref: '#/components/parameters/ProvinceIdFilter'
        - $ref: '#/components/parameters/DistrictIdFilter'
        - $ref: '#/components/parameters/SubstationIdFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/ReadingSort'
        - $ref: '#/components/parameters/ReadingOrder'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      responses:
        '200':
          description: A page of readings.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadingCollection' }
        '304': { $ref: '#/components/responses/NotModified' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
      security:
        - oauth2:
            - readings:read
        - bearerAuth: []
  /installations/{installation-id}/readings/{reading-id}:
    parameters:
      - $ref: '#/components/parameters/InstallationId'
      - $ref: '#/components/parameters/ReadingId'
    get:
      tags: [ Readings ]
      summary: One reading (the target of the Location header after ingestion)
      operationId: getReading
      responses:
        '200':
          description: The reading.
          headers:
            Last-Modified: { $ref: '#/components/headers/Last-Modified' }
            ETag: { $ref: '#/components/headers/ETag' }
            Cache-Control: { $ref: '#/components/headers/Cache-Control' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reading' }
        '304': { $ref: '#/components/responses/NotModified' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      parameters:
        - { $ref: '#/components/parameters/IfNoneMatch' }
        - { $ref: '#/components/parameters/IfModifiedSince' }
      security:
        - oauth2:
            - readings:read
        - bearerAuth: []

components:
  parameters:
    Offset:
      name: offset
      in: query
      description: Zero-based position of the first item to return.
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    ProvinceIdFilter:
      name: province-id
      in: query
      description: Only items in this province. Must be inside the caller's jurisdiction (otherwise 403).
      schema: { type: string, pattern: '^pv-[0-9]{2}$', example: pv-01 }
    DistrictIdFilter:
      name: district-id
      in: query
      description: Only items in this district. Must be inside the caller's jurisdiction (otherwise 403).
      schema: { type: string, pattern: '^ds-[0-9]{2}$', example: ds-01 }
    SubstationIdFilter:
      name: substation-id
      in: query
      description: Only items connected to this grid substation. Must be inside the caller's jurisdiction.
      schema: { type: string, pattern: '^gss-[0-9]{3}$', example: gss-001 }
    From:
      name: from
      in: query
      description: 'Start of the time window over recorded_at, inclusive (ISO 8601; encode "+" as %2B).'
      schema: { type: string, format: date-time, example: '2026-10-01T00:00:00Z' }
    To:
      name: to
      in: query
      description: End of the time window over recorded_at, exclusive. Must be later than `from`.
      schema: { type: string, format: date-time, example: '2026-10-02T00:00:00Z' }
    ReadingSort:
      name: sort
      in: query
      description: Field to sort by; recorded_at is the reading timestamp.
      schema: { type: string, enum: [ recorded_at, power_kw ], default: recorded_at }
    ReadingOrder:
      name: order
      in: query
      schema: { type: string, enum: [ asc, desc ], default: desc }
    ProvinceId:
      name: province-id
      in: path
      required: true
      schema: { type: string, pattern: '^pv-[0-9]{2}$', example: pv-01 }
    DistrictId:
      name: district-id
      in: path
      required: true
      schema: { type: string, pattern: '^ds-[0-9]{2}$', example: ds-01 }
    SubstationId:
      name: substation-id
      in: path
      required: true
      schema: { type: string, pattern: '^gss-[0-9]{3}$', example: gss-001 }
    InstallationId:
      name: installation-id
      in: path
      required: true
      schema: { type: string, pattern: '^ins-[0-9]{4,}$', example: ins-0001 }
    ReadingId:
      name: reading-id
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag(s) of the copy the client holds; 304 if it is still current. Takes precedence over If-Modified-Since.
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: ETag of the version being edited; the write is refused with 412 if it is no longer current.
      schema: { type: string }
    IfUnmodifiedSince:
      name: If-Unmodified-Since
      in: header
      description: HTTP-date; the write is refused with 412 if the resource changed after it (ignored when If-Match is sent).
      schema: { type: string }
    IfModifiedSince:
      name: If-Modified-Since
      in: header
      description: HTTP-date of the copy the client holds; 304 if unchanged since (ignored when If-None-Match is sent).
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /oauth2/token`.
    oauth2:
      type: oauth2
      description: |
        Devices use the client credentials grant (client_id = installation id). SLSEA users use the
        password grant. Both return a JWT bearer token.
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            readings:write: Append generation readings for the authenticated installation only
        password:
          tokenUrl: /oauth2/token
          scopes:
            assets:read: Read the hierarchy and installations within the user's jurisdiction
            readings:read: Read generation readings and summaries within the user's jurisdiction
            installations:write: Register, replace, update and decommission installations (national admins)

  headers:
    ETag:
      description: Strong entity tag of this representation; send it back in `If-None-Match` or `If-Match`.
      schema: { type: string, example: '"5d41402abc4b2a76b9719d911017c592"' }
    Last-Modified:
      description: When the underlying data last changed (HTTP-date).
      schema: { type: string, example: 'Sat, 03 Oct 2026 08:45:00 GMT' }
    Location:
      description: Absolute URI of the resource that was created.
      schema: { type: string, format: uri }
    WWW-Authenticate:
      description: Authentication scheme and error (RFC 6750).
      schema: { type: string, example: 'Bearer realm="slsea", error="invalid_token"' }
    Cache-Control:
      description: "private, no-cache: responses depend on the caller's jurisdiction and must be revalidated."
      schema:
        type: string
        example: private, no-cache

  schemas:
    Error:
      type: object
      description: The single error body used for every 4xx and 5xx response (WSO2 §11).
      required: [ code, message, description, more_info, errors ]
      properties:
        code: { type: integer, description: Product-specific error code (HTTP status x 100 + sequence), example: 40401 }
        message: { type: string, description: What went wrong with this request, example: "Installation 'ins-9999' was not found." }
        description: { type: string, description: 'Short, stable description of the error code', example: Resource not found }
        more_info: { type: string, format: uri, description: Link to the catalogue entry for this code }
        errors:
          type: array
          description: Individual problems, for example one entry per invalid field or parameter.
          items: { $ref: '#/components/schemas/ErrorListItem' }
    ErrorListItem:
      type: object
      required: [ code, message ]
      properties:
        code: { type: integer, example: 40002 }
        field: { type: string, description: The body field or query parameter concerned, example: power_kw }
        message: { type: string, example: must be greater than or equal to 0 }
    ErrorCatalogueEntry:
      type: object
      properties:
        code: { type: integer, example: 40401 }
        http_status: { type: integer, example: 404 }
        description: { type: string }
        resolution: { type: string }
    Page:
      type: object
      description: Paginated collection shape (WSO2 §10.3).
      required: [ count, offset, limit, next, previous, items ]
      properties:
        count: { type: integer, description: Total number of items matching the query (all pages), example: 25 }
        offset: { type: integer, example: 0 }
        limit: { type: integer, example: 50 }
        next: { type: [ string, 'null' ], format: uri, description: 'Absolute URL of the next page, or null on the last page' }
        previous: { type: [ string, 'null' ], format: uri, description: 'Absolute URL of the previous page, or null on the first page' }
        items: { type: array, items: {} }
    Province:
      type: object
      required: [ province_id, name ]
      properties:
        province_id: { type: string, example: pv-01 }
        name: { type: string, example: Western }
    District:
      type: object
      required: [ district_id, name, province_id ]
      properties:
        district_id: { type: string, example: ds-01 }
        name: { type: string, example: Colombo }
        province_id: { type: string, example: pv-01 }
    GridSubstation:
      type: object
      required: [ substation_id, name, district_id ]
      properties:
        substation_id: { type: string, example: gss-001 }
        name: { type: string, example: Kolonnawa Grid Substation }
        district_id: { type: string, example: ds-01 }
    Installation:
      type: object
      required: [ installation_id, inverter_id, substation_id, capacity_kw, latitude, longitude, commissioned_on, status ]
      properties:
        installation_id: { type: string, readOnly: true, example: ins-0001 }
        inverter_id: { type: string, description: Serial of the site's reporting inverter (the meter identifier), example: INV-4AAE4E09 }
        substation_id: { type: string, example: gss-001 }
        capacity_kw: { type: number, exclusiveMinimum: 0, maximum: 500, example: 5 }
        latitude: { type: number, minimum: 5.8, maximum: 10, example: 6.8603 }
        longitude: { type: number, minimum: 79.4, maximum: 82, example: 79.91942 }
        commissioned_on: { type: string, format: date, example: '2020-10-22' }
        status: { type: string, enum: [ active, maintenance ], example: active }
    InstallationComposite:
      allOf:
        - $ref: '#/components/schemas/Installation'
        - type: object
          required: [ location, last_reading ]
          properties:
            location:
              type: object
              properties:
                grid_substation:
                  type: object
                  properties:
                    substation_id: { type: string, example: gss-001 }
                    name: { type: string, example: Kolonnawa Grid Substation }
                district:
                  type: object
                  properties:
                    district_id: { type: string, example: ds-01 }
                    name: { type: string, example: Colombo }
                province:
                  type: object
                  properties:
                    province_id: { type: string, example: pv-01 }
                    name: { type: string, example: Western }
            last_reading:
              oneOf:
                - $ref: '#/components/schemas/Reading'
                - type: 'null'
    Reading:
      type: object
      description: One entry in an installation's append-only generation time series.
      required: [ reading_id, installation_id, recorded_at, power_kw, energy_kwh, voltage_v, received_at ]
      properties:
        reading_id: { type: integer, readOnly: true, example: 865 }
        installation_id: { type: string, readOnly: true, example: ins-0001 }
        recorded_at: { type: string, format: date-time, description: When the device measured the values (UTC), example: '2026-10-03T08:45:00.000Z' }
        power_kw: { type: number, minimum: 0, description: Instantaneous AC output power, example: 1.931 }
        energy_kwh: { type: number, minimum: 0, description: Cumulative lifetime energy counter of the inverter, example: 38012.499 }
        voltage_v: { type: number, description: Grid voltage at the inverter, example: 231.7 }
        received_at: { type: string, format: date-time, readOnly: true, description: When the API received the reading (server clock), example: '2026-10-03T08:45:10.809Z' }
    ReadingCollection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items: { type: array, items: { $ref: '#/components/schemas/Reading' } }
    ProvinceCollection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items: { type: array, items: { $ref: '#/components/schemas/Province' } }
    DistrictCollection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items: { type: array, items: { $ref: '#/components/schemas/District' } }
    GridSubstationCollection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items: { type: array, items: { $ref: '#/components/schemas/GridSubstation' } }
    InstallationCollection:
      allOf:
        - $ref: '#/components/schemas/Page'
        - properties:
            items: { type: array, items: { $ref: '#/components/schemas/Installation' } }
    GenerationSummary:
      type: object
      required: [ district_id, district_name, installation_count, installed_capacity_kw, reporting_installation_count, reporting_window_minutes, current_total_power_kw, as_of, date, timezone, total_energy_kwh ]
      properties:
        district_id: { type: string, example: ds-01 }
        district_name: { type: string, example: Colombo }
        installation_count: { type: integer, description: Registered (not decommissioned) installations, example: 31 }
        installed_capacity_kw: { type: number, example: 303 }
        reporting_installation_count: { type: integer, description: Installations whose latest reading is within the reporting window, example: 30 }
        reporting_window_minutes: { type: integer, example: 60 }
        current_total_power_kw: { type: number, example: 107.096 }
        as_of: { type: [ string, 'null' ], format: date-time, description: Newest reading counted in the current total }
        date: { type: string, format: date, example: '2026-10-02' }
        timezone: { type: string, example: Asia/Colombo }
        total_energy_kwh: { type: number, description: Energy generated in the district on `date`, example: 1205.709 }
    ReadingInput:
      type: object
      additionalProperties: false
      required: [ recorded_at, power_kw, energy_kwh, voltage_v ]
      properties:
        recorded_at: { type: string, format: date-time, description: Measurement time (must not be in the future), example: '2026-10-03T09:00:00Z' }
        power_kw: { type: number, minimum: 0, example: 1.2 }
        energy_kwh: { type: number, minimum: 0, description: Cumulative lifetime counter; never lower than the previous reading, example: 38012.799 }
        voltage_v: { type: number, minimum: 0, maximum: 500, example: 231.2 }
    InstallationInput:
      type: object
      description: Every writable field of an installation (PUT replaces all of them).
      additionalProperties: false
      required: [ inverter_id, substation_id, capacity_kw, latitude, longitude, commissioned_on, status ]
      properties:
        inverter_id: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{3,39}$', example: INV-7F3A21C9 }
        substation_id: { type: string, pattern: '^gss-[0-9]{3}$', example: gss-001 }
        capacity_kw: { type: number, exclusiveMinimum: 0, maximum: 500, example: 6 }
        latitude: { type: number, minimum: 5.8, maximum: 10, example: 6.91 }
        longitude: { type: number, minimum: 79.4, maximum: 82, example: 79.88 }
        commissioned_on: { type: string, format: date, description: Not in the future, example: '2026-09-15' }
        status: { type: string, enum: [ active, maintenance ], example: active }
    InstallationCreate:
      allOf:
        - $ref: '#/components/schemas/InstallationInput'
      description: Same as InstallationInput, but status is optional and defaults to active.
      required: [ inverter_id, substation_id, capacity_kw, latitude, longitude, commissioned_on ]
    InstallationPatch:
      type: object
      description: Any non-empty subset of the writable fields (JSON Merge Patch).
      additionalProperties: false
      minProperties: 1
      properties:
        inverter_id: { type: string, pattern: '^[A-Z0-9][A-Z0-9-]{3,39}$' }
        substation_id: { type: string, pattern: '^gss-[0-9]{3}$' }
        capacity_kw: { type: number, exclusiveMinimum: 0, maximum: 500 }
        latitude: { type: number, minimum: 5.8, maximum: 10 }
        longitude: { type: number, minimum: 79.4, maximum: 82 }
        commissioned_on: { type: string, format: date }
        status: { type: string, enum: [ active, maintenance ], example: maintenance }
    InstallationCreated:
      allOf:
        - $ref: '#/components/schemas/InstallationComposite'
        - type: object
          required: [ device_secret ]
          properties:
            device_secret: { type: string, description: 'Shown once. The device authenticates with client_id = installation_id and this secret.' }
    DecommissionedInstallation:
      allOf:
        - $ref: '#/components/schemas/Installation'
        - type: object
          properties:
            status: { type: string, enum: [ decommissioned ] }
            decommissioned_at: { type: string, format: date-time }
    TokenRequest:
      type: object
      required: [ grant_type ]
      properties:
        grant_type: { type: string, enum: [ client_credentials, password ] }
        client_id: { type: string, description: Installation id (devices), example: ins-0001 }
        client_secret: { type: string, description: Device secret (devices), writeOnly: true }
        username: { type: string, description: SLSEA username (users), example: colombo.analyst }
        password: { type: string, description: SLSEA password (users), writeOnly: true }
        scope: { type: string, description: 'Optional space-separated subset of the scopes the client may hold', example: assets:read }
    TokenResponse:
      type: object
      required: [ access_token, token_type, expires_in, scope ]
      properties:
        access_token: { type: string, description: 'JWT (HS256) carrying sub, role, scope and, for users, jurisdiction' }
        token_type: { type: string, enum: [ Bearer ] }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string, example: assets:read readings:read }
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 1.0.0
        uptime_seconds:
          type: integer
    DatabaseHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        database:
          type: string
          enum:
            - ok
            - unavailable
        latency_ms:
          type: integer

  responses:
    BadRequest:
      description: A query parameter or body field is invalid; `errors` lists each problem.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: The bearer token is missing, invalid or expired.
      headers:
        WWW-Authenticate: { $ref: '#/components/headers/WWW-Authenticate' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The token is valid but lacks the scope, or the resource is outside the caller's jurisdiction.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No resource exists with this identifier.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotAcceptable:
      description: The Accept header excludes application/json.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with existing state (duplicate reading instant or inverter_id).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: If-Match / If-Unmodified-Since did not match the current resource; nothing was changed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: The request body is not in a media type this operation accepts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Too many failed attempts for this credential; see the RateLimit headers.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotModified:
      description: The client's cached copy is current (empty body).
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
        Last-Modified: { $ref: '#/components/headers/Last-Modified' }
