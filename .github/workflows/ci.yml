name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: slsea
          POSTGRES_PASSWORD: slsea
          POSTGRES_DB: slsea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://slsea:slsea@localhost:5432/slsea_test
      JWT_SECRET: ci-only-secret-not-used-in-production-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint the JavaScript
        run: npm run lint
      - name: Lint the OpenAPI document
        run: npm run lint:openapi
      - name: Test with coverage gate (lines 95%, branches 90%, functions 95%)
        run: npm run test:coverage
